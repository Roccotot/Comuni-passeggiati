<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comuni Passeggiati 🚶</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-success py-2">
  <div class="container-fluid d-flex align-items-center gap-3">
    <span class="navbar-brand mb-0 fw-bold fs-5">🚶 Comuni Passeggiati</span>
    <span class="text-white-50 small d-none d-md-block">Segna i comuni italiani che hai visitato</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="badge bg-light text-success fs-6 px-3 py-2" id="badge-totale">0 / 7978</span>
      <span class="badge bg-white text-success fs-6 px-3 py-2" id="badge-pct">0%</span>
      <!-- Importa da file -->
      <button class="btn btn-sm btn-outline-light px-2 py-1" id="btn-import"
              title="Importa dati da file">
        📂 Importa
      </button>
      <input type="file" id="import-file-input" accept=".json" class="d-none">
    </div>
  </div>
</nav>

<!-- PROGRESS BAR TOTALE -->
<div class="bg-success bg-opacity-10 border-bottom px-3 py-2">
  <div class="d-flex align-items-center gap-2">
    <small class="text-muted fw-semibold" style="min-width:90px">🇮🇹 Italia</small>
    <div class="progress flex-grow-1" style="height:14px">
      <div class="progress-bar bg-success" id="progress-italia" style="width:0%"></div>
    </div>
    <small class="text-muted fw-semibold" id="txt-italia" style="min-width:40px">0%</small>
  </div>
</div>

<!-- TABS -->
<div class="container-fluid px-3 py-2">
  <ul class="nav nav-tabs" id="mainTabs">
    <li class="nav-item">
      <a class="nav-link active" data-bs-toggle="tab" href="#tab-tabella">📋 Tabella</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-bs-toggle="tab" href="#tab-mappa" id="tab-mappa-link">🗺️ Mappa</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" data-bs-toggle="tab" href="#tab-stats">📊 Statistiche</a>
    </li>
  </ul>

  <div class="tab-content mt-3">

    <!-- ===== TAB TABELLA ===== -->
    <div class="tab-pane fade show active" id="tab-tabella">
      <!-- FILTRI -->
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-4">
          <input type="text" class="form-control form-control-sm" id="search-input"
                 placeholder="🔍 Cerca comune, provincia, regione...">
        </div>
        <div class="col-6 col-md-3">
          <select class="form-select form-select-sm" id="filter-regione">
            <option value="">Tutte le Regioni</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select form-select-sm" id="filter-provincia">
            <option value="">Tutte le Province</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select form-select-sm" id="filter-visitato">
            <option value="">Tutti</option>
            <option value="1">✅ Visitati</option>
            <option value="0">⬜ Non visitati</option>
          </select>
        </div>
        <div class="col-6 col-md-1 d-flex align-items-center">
          <button class="btn btn-sm btn-outline-secondary w-100" id="btn-reset-filtri" title="Azzera filtri">✕ Reset</button>
        </div>
      </div>

      <!-- TABELLA -->
      <div id="loading-spinner" class="text-center py-5">
        <div class="spinner-border text-success" role="status"></div>
        <p class="mt-2 text-muted">Caricamento comuni...</p>
      </div>

      <div id="table-container" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <small class="text-muted" id="table-info">Mostrando 0 di 0 comuni</small>
          <div class="d-flex align-items-center gap-2">
            <small class="text-muted">Righe per pagina:</small>
            <select class="form-select form-select-sm" id="page-size-select" style="width:auto">
              <option value="50">50</option>
              <option value="100" selected>100</option>
              <option value="200">200</option>
              <option value="500">500</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-sm table-hover table-bordered align-middle" id="comuni-table">
            <thead class="table-dark sticky-top">
              <tr>
                <th class="sortable" data-col="comune">Comune <span class="sort-icon">↕</span></th>
                <th class="sortable" data-col="provincia">Provincia <span class="sort-icon">↕</span></th>
                <th class="sortable" data-col="regione">Regione <span class="sort-icon">↕</span></th>
                <th class="sortable text-end" data-col="abitanti">Abitanti <span class="sort-icon">↕</span></th>
                <th class="sortable text-end" data-col="altitudine">Alt. (m) <span class="sort-icon">↕</span></th>
                <th class="sortable text-end" data-col="temp_media">Temp. °C <span class="sort-icon">↕</span></th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <!-- PAGINAZIONE -->
        <nav id="pagination-container" class="d-flex justify-content-center mt-3"></nav>
      </div>
    </div>

    <!-- ===== TAB MAPPA ===== -->
    <div class="tab-pane fade" id="tab-mappa">
      <div class="d-flex gap-2 mb-2">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="map-show-all" checked>
          <label class="form-check-label small" for="map-show-all">Mostra tutti i comuni</label>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="map-show-visited" checked>
          <label class="form-check-label small" for="map-show-visited">Evidenzia visitati</label>
        </div>
        <span class="ms-auto badge bg-success" id="map-badge">0 visitati</span>
      </div>
      <div id="map" style="height: calc(100vh - 260px); min-height: 400px; border-radius: 8px; border: 1px solid #dee2e6;"></div>
    </div>

    <!-- ===== TAB STATISTICHE ===== -->
    <div class="tab-pane fade" id="tab-stats">
      <div id="stats-container" class="row g-3"></div>
    </div>

  </div>
</div>


<!-- TOAST NOTIFICA -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toast-notifica" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-testo"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
